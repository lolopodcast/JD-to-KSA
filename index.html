  /* ===== M1 ===== */
  m1_nav: "1. 為什麼職稱不能信",
  m1_title: "為什麼職稱不能信",
  m1_overview: "在 104 用「PM 專案管理」搜尋一次，回傳的職稱橫跨產品、專案、工程與業務四種不同的工作，第一筆甚至是一個業務營運職。同樣三個字母，指向的管理對象與層級都不一樣。這一節把這個現象攤開，說明為什麼任何以職稱為起點的分析都會在第一步失準，並帶出兩條互相獨立的軸。",
  m1_highlights: ["職稱不是證據", "同名異工", "單向混用", "名義 PM 實際 PjM", "兩軸的必要性", "以原句為依據"],
  m1_p1: "先看素材。2026 年 8 月在 104 以「PM 專案管理」搜尋，前幾頁回傳的職稱包括：PM產品管理師、產品管理師PM、產品經理（PM）、Product Manager (PM)、DRAM_產品管理師 PM、產品管理專員／PM【OLED偏光片】、專案管理師 (PM)、PM專案管理師／經理、PM專案管理工程師｜PM Engineer、工程專案管理－儲備PM、業務專案管理師、專案管理助理／PM助理，以及只寫兩個字母的 PM。這十九筆之中，有的管產品、有的管專案、有的掛在工程單位、有的掛在業務單位；有的是助理、有的是經理。它們唯一的共同點，是標題裡都出現了 PM 這兩個字母。",
  m1_p2: "職稱是雇主對外的行銷語言，工作內容才是雙方真正要履行的內容。",
  m1_p3: "更關鍵的是，這種混用不是隨機的雙向雜訊，而是單向的：絕大多數情況是名義上叫 PM、實際做的是 PjM 的工作；反過來，實際做產品管理卻被冠上專案經理職稱的案例很少。這個不對稱有它的成因——「產品經理」在人力市場上是一個比較好聽、比較好招募的標籤，於是被大量借用到本質上是專案執行的職務上。對你的分析而言，這個不對稱意味著：當你看到一個含 PM 的職稱時，先驗機率其實偏向專案管理，而不是產品管理。若直接把職稱當成分類依據，你的資料會系統性地高估產品經理的數量。",
  m1_p4: "所以我們需要換一個起點。這份教材採用兩條互相獨立的軸：軸一問「管理對象是產品還是專案」，軸二問「這個職位落在層級階梯的哪一階」。兩條軸獨立的意思是，知道了管理對象並不能推出層級，知道了層級也推不出管理對象——一個資深的專案經理和一個初階的產品專員，在兩條軸上的座標完全不同。把它們混成一條線（例如「PM 比 PjM 高階」）就是台灣人力市場最常見的誤解，也是讓資料失真的主因。",
  m1_p5: "實作上，這一節只留下一條鐵律：任何判定都必須能引用「工作內容」或「條件要求」欄位裡的一句原文當依據，職稱只能當成待驗證的假設。如果一份 JD 的工作內容通篇都在講時程、里程碑與跨部門進度追蹤，那麼即使標題寫著產品經理，它在軸一上就是 PjM。反之，如果內文出現產品損益、定價、產品生命週期，即使標題只寫著專案管理師，它在軸一上仍偏向 PM。這條規則會一路帶到第六節，成為你抽取規則裡的第一行。",
  m1_wrapup: "這一節只證明一件事：職稱是標籤，不是證據。同一組字母可以指向四種不同的工作，而且混用是單向的——多半是名義 PM、實際 PjM。因此以職稱為起點的任何統計，都會在第一步就把資料歪掉。解法不是找一個更精準的職稱清單，而是換一個起點：用管理對象與層級這兩條互相獨立的軸重新定位，並要求每一個判定都引用工作內容的原句作為依據。接下來兩節，就是把這兩條軸分別講清楚，讓它們變成可以寫進程式的規則。",
  m1_terms: [

    { front: "先驗偏誤", back: "若直接以職稱分類，資料會系統性高估產品經理的數量，因為混用是單向的。" },
    { front: "兩條獨立的軸", back: "軸一管理對象（產品／專案）、軸二層級。知道其中一條推不出另一條。" },
    { front: "原句依據", back: "每一個判定都要能引用工作內容或條件要求的一句原文，職稱只是待驗證的假設。" }

    { q: "課程說職稱的混用「是單向的」，指的是什麼？", opts: ["多半是名義上叫 PM、實際做的是專案管理工作", "多半是名義上叫 PjM、實際做的是產品管理工作", "產品與專案兩種職稱互相借用的比例大致相同", "只有外商會混用，本土企業的職稱一律很精準"], ans: _A0, exp: "產品經理是比較好招募的標籤，因而被大量借用到專案執行職務上。" },
    { q: "為什麼一份 JD 分析不能直接以職稱作為分類依據？", opts: ["職稱是雇主對外的標籤，不構成工作內容的證據", "職稱由主管機關統一核定，更新的速度過於緩慢", "職稱在 104 的欄位結構中屬於選填而經常從缺", "職稱與薪資區間高度相關，容易造成判讀的偏誤"], ans: _A0, exp: "職稱只能當成待驗證的假設，證據要回到工作內容原句。" },
    { q: "搜尋結果第一筆是一個業務營運職，這件事說明了什麼？", opts: ["求職平台的關鍵詞比對會把不相干的職缺一併回傳", "業務營運與產品管理在實務上其實已經合而為一", "求職平台已改用嚴格的職能分類來排序搜尋結果", "英文職稱比中文職稱更能精確描述它的管理對象"], ans: _A0, exp: "平台以關鍵詞比對回傳結果，因此清單本身就混入不相干職缺。" },
    { q: "既然職稱不可信，判讀一份 JD 應該回到哪裡找依據？", opts: ["回到工作內容與條件要求欄位的原句去找依據", "回到公司規模與資本額等基本資料去進行推論", "回到福利制度與休假制度所描述的工作型態上", "回到聯絡方式所留下的部門名稱去反推該職務"], ans: _A0, exp: "鐵律是：每個判定都要能引用一句原文，職稱不算依據。" },

  /* ===== M2 ===== */
  m2_nav: "2. 軸一 管理對象：PM 還是 PjM",
  m2_title: "軸一 管理對象：PM 還是 PjM",
  m2_overview: "軸一只問一個問題：這個職位管的對象是產品，還是專案。PM 是產品經理、做產品管理、管理對象是產品，別名 PdM／PDM；PjM 是專案經理、做專案管理、管理對象是專案，別名 PJM，亦稱 PCC。兩者的分界線不是模糊的分工感覺，而是新產品開發流程上的一個具體閘門：kick-off gate。",
  m2_highlights: ["管理對象＝產品", "管理對象＝專案", "RPM／TPM／OPM", "kick-off gate", "判定詞表", "PdM／PCC 別名"],
  m2_p1: "先把定義釘死。PM（Product Manager，產品經理）做的是產品管理，管理對象是「產品」——一條可以有損益、有生命週期、有版本與退場計畫的商品線。PjM（Project Manager，專案經理）做的是專案管理，管理對象是「專案」——任何有起訖、有範疇、有交付物的工作包，它可以是一個完整的產品開發專案，也可以只是其中一部分。這個差別看似細微，實際上決定了這個人每天在盯什麼：PM 盯的是這個產品要不要做、做成什麼樣、賣給誰、賺不賺錢；PjM 盯的是既然決定要做，怎麼在時間、資源與品質的限制下把它交出來。",
  m2_p2: "分界線就是新產品開發的 kick-off gate：PM 管到 Spec 定案，PjM 管定案之後的執行。",
  m2_p3: "PjM 依主責單位還有三種常見變體：RPM 是研發端的專案經理、TPM 是工程端的專案經理、OPM 是生產端的專案經理。要特別注意的是，這三者是 PjM 這條線底下的分支，不是與 PM 平行的第三、第四、第五條線。學生最常犯的錯是把 TPM 當成「技術型的產品經理」而放到 PM 那一格，這會讓整份分析的軸一分佈完全走樣。判斷方式很單純：只要它管的對象是一個有起訖的工作包，不論掛在研發、工程還是生產，它都在 PjM 這一側。",
  m2_p4: "接著是可操作的判定詞表。偏 PM 的詞包括：roadmap、產品生命週期、產品損益 P&L、市場需求、競品分析、定價、規格定義、EOL。偏 PjM 的詞包括：時程、里程碑、資源調配、風險管控、跨部門協調、進度追蹤、交付驗收、WBS 與甘特圖。實作時不要只找到一個詞就下判斷，而是把工作內容整段掃過，分別計算兩側命中的詞數，再看哪一側明顯占優。若兩側都命中且數量相近，那多半是一個混合職務，應該標記為「無法判定」並在依據欄位保留兩側各一句原文，而不是硬塞進其中一格。",
  m2_p5: "最後提醒兩件會影響資料品質的事。第一，別名要一起收：PdM、PDM 都是 PM，PJM、PCC 都是 PjM，抽取規則的關鍵詞表若漏了別名，會平白多出很多「無法判定」。第二，判定依據一律引用原句。你的輸出不應該只是「PjM」三個字母，而應該是「PjM｜依據：工作內容第 3 點『負責跨部門進度追蹤與里程碑管控』」。有原句的判定才可以被同組同學檢查、才可以在下一週回頭修正關鍵詞表。",
  m2_wrapup: "軸一是整套分析的地基，也是最容易被職稱帶偏的一條軸。記住三件事就夠了：第一，判別依據是管理對象——產品還是專案，不是職稱寫什麼。第二，分界線是 kick-off gate，PM 管到 Spec 定案，PjM 管定案之後的執行，這條線讓「模糊的分工感覺」變成一個可以指認的閘門。第三，RPM、TPM、OPM 是 PjM 的變體，不是與 PM 平行的線，看它管的是不是一個有起訖的工作包就能歸位。實作上用判定詞表掃描整段工作內容、計算兩側詞數、保留原句依據，兩側相近時誠實標記無法判定。",
  m2_terms: [
    { front: "PM 產品經理", back: "做產品管理，管理對象是產品：損益、生命週期、版本與退場計畫。別名 PdM／PDM。" },

    { front: "偏 PM 判定詞", back: "roadmap、產品生命週期、產品損益 P&L、市場需求、競品分析、定價、規格定義、EOL。" },
    { front: "偏 PjM 判定詞", back: "時程、里程碑、資源調配、風險管控、跨部門協調、進度追蹤、交付驗收、WBS／甘特。" }

  m3_nav: "3. 軸二 層級：從產品專員到 CPO",
  m3_title: "軸二 層級：從產品專員到 CPO",
  m3_overview: "軸二問的是這個職位落在哪一階。完整的階梯是：產品專員 PM Specialist → 產品工程師 PM Engineer → 初階產品經理 Junior PM → 資深產品經理 Senior PM → 產品總監 PM Director → 產品副總 VP／SVP of PM → 產品長 CPO。層級不只影響薪資，它會系統性地改變 JD 對 K、S、A 三個構面的要求。",
  m3_highlights: ["七階階梯", "年資是層級訊號", "管理責任欄位", "動詞的階梯", "學生的入口三級", "層級全收不過濾"],
  m3_p1: "先把七階排好。產品專員是入門，通常負責資料整理、報表產出與跨單位窗口；產品工程師偏技術支援與規格文件；初階產品經理開始獨立負責一條小產品線或一個模組；資深產品經理要對產品損益負責、要能決定取捨；產品總監管的是一組產品線與一群產品經理；產品副總對整個產品組合與策略負責；產品長則進入經營團隊，處理的是公司層次的產品策略與資源分配。這七階不是每家公司都齊備，但只要你把觀察到的職稱對回這七階，跨公司的比較才有共同尺度。",
  m3_p2: "層級不是薪資的同義詞，它是「這個人被允許做多大的決定」的刻度。",
  m3_p3: "層級如何改變 K／S／A？先看 K：入門階段的知識要求偏基礎——本科系、產業基本知識、常用術語；到了資深與總監階段，知識要求會轉向產業結構、法規與商業模式，而且經常不再明寫，因為它被假設為前提。再看 S：這是變化最劇烈的構面。年資本身就是 S 的訊號，因為年資是「足以完成任務」的證據；此外工具技能會從操作型（報表、簡報、資料整理）轉向決策型（損益模型、產品組合取捨、跨部門談判）。最後看 A：入門階段的態度詞多半是對內與對上（主動回報、抗壓、配合），到了總監以上，「對下」的態度詞才會大量出現，因為此時管理責任欄位通常會填「是」。",
  m3_p4: "怎麼從 JD 判層級？三個訊號一起看。第一是條件要求裡的工作經歷欄位，也就是年資：不到兩年多半是專員或工程師，三到五年落在初階到資深產品經理，八年以上才會出現總監級。第二是管理責任欄位，104 這一欄會明白寫出是否需要管理部屬與人數，這是層級最硬的證據。第三是工作內容裡的動詞：執行、協助、協調屬於低階；制定、定義、決策屬於中階；帶領團隊、建立制度、負責組織績效屬於高階。三個訊號互相矛盾時，以管理責任欄位優先，因為它是結構化欄位，最不容易灌水。",
  m3_p5: "最後兩個實作提醒。第一，層級要全收不過濾。學生常常只留下自己投得起的那幾階，這會讓你看不見完整階梯，也看不見「同一條產品線上，上面那一階到底多要求什麼」。全收之後你才會發現，從初階到資深之間增加的往往不是知識，而是決策責任。第二，認清你現在的實際入口：對大學部與碩士剛畢業的學生而言，可投的是階梯的前三級——產品專員、產品工程師、初階產品經理。第四級以上的 JD 你仍然要收、要讀，但那是拿來規劃三到五年路徑用的，不是拿來當下對照的。",
  m3_wrapup: "軸二把「資深」這種模糊的形容詞換成一把有七個刻度的尺。從產品專員一路到產品長，每上一階，K 的要求會從明寫轉為預設、S 的要求會從操作型轉為決策型、A 的要求會從對上與對內擴張到對下。判層級時看三個訊號：年資、管理責任欄位、工作內容的動詞，衝突時以管理責任欄位為準，因為它最難灌水。實作上層級全收不過濾，讓完整階梯呈現出來；同時清楚知道你現在的入口是前三級，其餘的是路徑資訊，不是當下的對照組。",

    { front: "年資訊號", back: "條件要求裡的工作經歷欄位。年資是層級最常見的訊號，也是 S 的證據。" },
    { front: "管理責任欄位", back: "104 的結構化欄位，明寫是否需要管理部屬與人數，是層級最硬的證據。" },

    { front: "學生的入口三級", back: "產品專員、產品工程師、初階產品經理。其餘層級收來規劃路徑用。" },

    { q: "從一份 JD 判斷層級時，哪一個訊號最不容易被灌水？", opts: ["管理責任欄位，因為它是結構化欄位而且明寫", "職稱裡出現的資深、主任、副理等修飾用字眼", "工作待遇欄位所揭露的月薪或年薪級距數字", "福利制度欄位裡列出的股票與分紅相關條件"], ans: _A0, exp: "三個訊號衝突時以管理責任欄位優先，因為它結構化而具體。" },
    { q: "隨著層級上升，K 知識構面的要求會出現什麼變化？", opts: ["從明寫的基礎知識轉為被假設為前提而不明寫", "從被假設為前提逐步轉為條列得越來越詳細具體", "始終維持在學歷與科系兩欄，完全不隨層級變化", "改由語文條件欄位承接，學歷科系兩欄不再填寫"], ans: _A0, exp: "高階職位的知識要求常被視為前提，因此反而在文本中消失。" },
    { q: "工作內容裡的動詞如何反映層級高低？", opts: ["執行協調偏低階、制定決策偏中階、帶領偏高階", "執行協調偏高階、制定決策偏中階、帶領偏低階", "動詞只反映管理對象是產品或專案，與層級無關", "動詞只反映產業別差異，不能用來推斷層級高低"], ans: _A0, exp: "動詞的階梯從執行到決策再到帶領組織，是層級的語意訊號。" },
    { q: "對剛畢業的學生而言，階梯上實際可投的是哪三級？", opts: ["產品專員、產品工程師、初階產品經理這三級", "初階產品經理、資深產品經理、產品總監三級", "產品工程師、資深產品經理、產品副總這三級", "產品專員、資深產品經理、產品長 CPO 三級"], ans: _A0, exp: "前三級是實際入口，第四級以上收來規劃三到五年路徑。" },
    { q: "為什麼分析時要「層級全收不過濾」？", opts: ["才看得見完整階梯與各階之間真正增加的要求", "才能讓資料集的樣本數達到統計檢定的門檻值", "因為 104 的搜尋結果本來就無法依層級做篩選", "因為層級欄位屬於選填，過濾後樣本會全部消失"], ans: _A0, exp: "只留自己投得起的幾階，就看不見上一階究竟多要求了什麼。" }

  /* ===== M4 ===== */
  m4_nav: "4. 104 的欄位結構就是半套抽取規則",
  m4_title: "104 的欄位結構就是半套抽取規則",
  m4_overview: "好消息是：104 的職缺頁已經是結構化的。它把資訊切進固定欄位，等於幫你寫好了半套抽取規則。壞消息是只有半套——六個結構化欄位可以規則式對映到 K 與 S，但「其他條件」與「工作內容」這兩欄仍然需要語意判讀，而 A 幾乎全部藏在這兩欄裡。",
  m4_highlights: ["完整欄位結構", "六欄規則式", "兩欄語意判讀", "年資歸 S", "管理責任欄位", "K／S／A 操作型定義"],
  m4_p1: "先把欄位結構看完整。104 職缺頁的主要欄位依序是：工作內容、職務類別、工作待遇、工作性質、上班地點、遠端工作、管理責任、出差外派、上班時段、休假制度、可上班日、需求人數，接著是「條件要求」這個群組，底下含工作經歷、學歷要求、科系要求、語文條件、擅長工具、工作技能、其他條件七個子欄位，最後是福利制度與聯絡方式。認清這張表最大的價值是：你不必自己發明分段規則，平台已經幫你分好了段。",
  m4_p2: "結構化欄位是雇主被迫具體的地方；自由文字欄位才是雇主可以含糊的地方。",
  m4_p3: "接著是對映。學歷要求與科系要求對映到 K 知識，因為它們描述的是該領域的知識基礎，可以規則式抽取。工作經歷（年資）對映到 S 技能——這一點最常被搞錯，很多人直覺把年資歸到 K，理由是「做久了知道的比較多」。但年資在 JD 裡的功能不是描述知道什麼，而是作為「足以完成任務」的證據，所以它是 S。語文條件、擅長工具、工作技能三欄也對映到 S，同樣可以規則式抽取。到這裡為止的六欄，都不需要語意模型，用欄位名稱直接對映就好。",
  m4_p4: "剩下兩欄需要語意判讀。「其他條件」以 A 態度為主但混雜，裡面經常同時出現態度詞、加分技能與工作型態說明，必須逐句判斷。「工作內容」則三者皆有：它會描述要負責的產品或專案（提供軸一的證據）、會用動詞暗示層級（提供軸二的證據），也會夾帶知識與技能要求。這兩欄就是你 Agent 裡唯一需要語意能力的地方，其餘六欄用規則就能穩定產出。這個切分很重要：它讓你知道錯誤會出現在哪裡，也讓你知道當「無法判定」比例過高時，該去修的是哪一段。",
  m4_p5: "最後補一個 K 與 S 的分辨尺，第五節還會再用一次。K 是知識，回答「知道什麼」；S 是技能，回答「能做到什麼，而且有證據」；A 是態度，回答「傾向怎麼做」。年資、工具、語文檢定分數都有證據，所以是 S；學歷與科系描述的是知識基礎，所以是 K。至於 A，它的特徵剛好是沒有證據——這就是下一節要處理的問題。另外提醒：管理責任欄位雖然結構化，但它不直接對映到 K 或 S，它的用處是預測 A 裡面「對下」象限會不會出現。",
  m4_wrapup: "104 的欄位結構等於一份現成的抽取規則骨架。學歷要求與科系要求歸 K；工作經歷、語文條件、擅長工具、工作技能歸 S——年資歸 S 是因為它是「足以完成任務」的證據，不是知識本身。剩下的「其他條件」與「工作內容」需要語意判讀，前者以 A 為主但混雜，後者三個構面都有，同時提供軸一與軸二的證據。把這個切分寫進規格，你就知道規則式那六欄應該幾乎不出錯，一旦錯誤率升高，問題一定出在那兩欄的語意判讀上。",
  m4_terms: [
    { front: "條件要求群組", back: "含工作經歷、學歷要求、科系要求、語文條件、擅長工具、工作技能、其他條件七個子欄位。" },
    { front: "規則式對映", back: "六個結構化欄位依欄位名稱直接對映到 K 或 S，不需要語意模型。" },
    { front: "年資歸 S", back: "年資的功能是作為「足以完成任務」的證據，不是描述知道什麼，所以屬技能。" },
    { front: "其他條件欄位", back: "以 A 態度為主但混雜加分技能與工作型態，必須逐句語意判讀。" },
    { front: "工作內容欄位", back: "K／S／A 三者皆有，同時提供軸一管理對象與軸二層級的證據。" },
    { front: "管理責任欄位", back: "結構化但不直接對映 K 或 S，用途是預測 A 的「對下」象限會不會出現。" }
  ],
  m4_q: [
    { q: "為什麼說 104 的欄位結構已經是「半套抽取規則」？", opts: ["六個結構化欄位可直接對映，兩欄仍需語意判讀", "所有欄位都能直接對映，完全不需要任何語意判讀", "所有欄位都需語意判讀，結構本身沒有提供任何幫助", "欄位結構只對薪資分析有用，對能力構面沒有幫助"], ans: _A0, exp: "六欄規則式、兩欄語意判讀，這就是半套的意思。" },
    { q: "在 K／S／A 的對映裡，工作經歷（年資）應該歸到哪一構面？", opts: ["歸 S 技能，因為它是足以完成任務的證據", "歸 K 知識，因為做得久自然就知道得比較多", "歸 A 態度，因為它反映的是求職者的穩定度", "同時歸入 K 與 S，因為年資兩種性質都具備"], ans: _A0, exp: "年資的功能是證據而非知識內容，因此屬技能構面。" },
    { q: "下列哪一組欄位可以規則式對映到 K 知識？", opts: ["學歷要求與科系要求這兩個結構化欄位", "擅長工具與工作技能這兩個結構化欄位", "工作內容與其他條件這兩個自由文字欄位", "管理責任與需求人數這兩個結構化欄位"], ans: _A0, exp: "這兩欄描述的正是該領域的知識基礎。" },
    { q: "哪兩個欄位是整套規則裡唯一需要語意判讀的？", opts: ["其他條件與工作內容", "學歷要求與科系要求", "語文條件與擅長工具", "工作待遇與福利制度"], ans: _A0, exp: "其他條件以 A 為主但混雜，工作內容則三個構面都有。" },
    { q: "管理責任欄位在這套規則裡的正確用途是什麼？", opts: ["用來預測 A 裡面「對下」象限會不會出現", "用來直接對映成 K 知識構面的一個條目", "用來直接對映成 S 技能構面的一個條目", "用來取代工作經歷欄位作為年資的來源"], ans: _A0, exp: "它結構化但不直接對映 K 或 S，價值在於預測對下態度詞。" },
    { q: "分辨 K 與 S 最實用的一把尺是什麼？", opts: ["K 回答知道什麼，S 回答能做到什麼且有證據", "K 回答能做到什麼，S 回答知道什麼且有證據", "K 出現在自由文字欄，S 出現在結構化欄位", "K 只看學歷高低，S 只看工作年資長短而定"], ans: _A0, exp: "有證據的是 S，描述知識基礎的是 K。" }
  ],

  /* ===== M5 ===== */
  m5_nav: "5. A 為什麼最難：四象限與不可觀察性",
  m5_title: "A 為什麼最難：四象限與不可觀察性",
  m5_overview: "K 與 S 都有欄位可以對映，A 沒有。它散落在「其他條件」與「工作內容」的自由文字裡，而且大多以無法查證的形容詞出現。這一節提供一個結構——對上／對下／對內／對外四象限——讓 A 至少可以被分類；同時要求你對這個結構本身保持懷疑。",
  m5_highlights: ["S 有證據 A 沒有", "四象限", "對下的空格", "管理責任的預測力", "自由文字的退卻", "把批判留給自己"],
  m5_p1: "先把界線畫清楚。分辨 S 與 A 最實用的一把尺是：S 有證據，A 沒有。多益 850 分是證據、能操作某套系統是證據、三年產品線經驗是證據；「抗壓性佳」「主動積極」「具團隊精神」則沒有任何可查證的對應物。這不是說態度不重要，而是說它在文本層次上不可觀察。你的 Agent 抽出 A 時，抽到的其實是「雇主希望被看見的自我描述」，不是「雇主真正會用來篩選的標準」。這個區別要一直記著，否則你會做出一份看起來很豐富、實際上沒有資訊量的 A 清單。",
  m5_p2: "企業填結構化欄位時非常具體，一談到態度就退回自由文字——這件事本身就是 A 不可觀察的證據。",
  m5_p3: "接著是四象限。把 A 依互動對象分成四格：對上（面向主管，例如主動回報、承接指派、不隱藏壞消息）、對下（面向部屬，例如帶領新人、培育團隊成員、分派任務）、對內（面向同儕與跨部門，例如協作、補位、不推諉）、對外（面向客戶與供應商，例如服務熱忱、耐心說明、對外協調）。四象限的價值不在於分類本身，而在於它會讓「缺了什麼」變得可見。你會很快發現：在非主管職的 JD 裡，對下那一格幾乎永遠是空的。",
  m5_p4: "為什麼空？因為對下的態度只有在這個人真的要帶人時才有意義，而是否帶人正好寫在結構化的「管理責任」欄位裡。這就形成一個可以驗證的預測：管理責任填「否」的 JD，其他條件裡幾乎不會出現對下的態度詞；管理責任填「是」且人數大於零的 JD，對下的態度詞出現機率明顯升高。這個預測值得你在自己的資料集上實際檢驗一次——如果驗證成立，你就得到一條可以寫進規則的推論；如果不成立，那更有意思，代表你的樣本裡有些公司在用「帶人」的語言招募不帶人的職位。",
  m5_p5: "最後，請對四象限本身保持懷疑。它是一個方便的分類架構，不是一個經過驗證的能力理論。至少有三個問題值得你在小組討論時提出來：第一，同一句態度詞可能同時落在兩格（「跨部門協調」既對內也可能對外），硬要單選會製造假精確。第二，四象限只描述互動對象，不描述強度與情境，因此兩份 JD 的 A 清單即使完全一樣，實際要求也可能天差地遠。第三，也是最根本的：如果 A 在文本層次不可觀察，那把它抽出來到底解決了什麼問題？這一節不給你答案，這是你要在期末專案裡自己面對的問題。",
  m5_wrapup: "A 是三個構面裡最難的，難在它沒有欄位、沒有證據，只有形容詞。四象限——對上、對下、對內、對外——提供的是一個讓缺口變可見的結構：非主管職的對下格幾乎永遠是空的，而這個空格可以用結構化的管理責任欄位預測，這是一條你可以在自己資料集上驗證的推論。但四象限本身不是理論：一句話可能跨兩格、象限不描述強度、而且最根本的疑問仍然懸著——不可觀察的東西被抽取出來之後，究竟能支持什麼決策。把這個問題帶進小組討論，比背下四個名詞有用得多。",
  m5_terms: [

    { front: "自由文字的退卻", back: "企業填結構化欄位很具體，一到態度就退回自由文字，這正是不可觀察的證據。" },
    { front: "四象限的限制", back: "一句話可能跨兩格、象限不描述強度與情境，硬要單選會製造假精確。" }

  m5_q: [
    { q: "分辨 S 技能與 A 態度最實用的一把尺是什麼？", opts: ["S 有可查證的證據，A 沒有任何對應物", "S 出現在自由文字，A 出現在結構化欄位", "S 只跟工具有關，A 只跟語文條件有關聯", "S 由學歷決定，A 由工作年資的長短決定"], ans: _A0, exp: "檢定分數、工具操作、年資都是證據；抗壓與積極沒有。" },
    { q: "A 的四象限是依什麼標準劃分出來的？", opts: ["依態度所面向的互動對象來劃分四個格子", "依態度被要求的強度高低來劃分四個格子", "依態度出現在哪一個欄位來劃分四個格子", "依態度是否可被量化來劃分出四個格子來"], ans: _A0, exp: "四象限是對上、對下、對內、對外，依互動對象劃分。" },
    { q: "在非主管職的 JD 裡，四象限中哪一格幾乎永遠是空的？", opts: ["對下，因為不帶人就不需要這一類的態度", "對上，因為向主管回報被視為理所當然的事", "對內，因為跨部門協作已寫在工作內容裡了", "對外，因為面對客戶的職務通常另外開職缺"], ans: _A0, exp: "對下態度只有在真的要帶人時才有意義。" },
    { q: "哪一個結構化欄位可以用來預測「對下」象限是否出現？", opts: ["管理責任欄位，它明寫是否帶人與人數", "工作性質欄位，它寫的是全職或兼職別", "需求人數欄位，它寫的是本次招募人數", "上班時段欄位，它寫的是輪班或日班制"], ans: _A0, exp: "管理責任填是且人數大於零時，對下態度詞出現機率明顯升高。" },
    { q: "課程說「企業一談到態度就退回自由文字」，這件事被當成什麼？", opts: ["A 在文本層次上不可觀察的一項實際證據", "企業填寫職缺頁時普遍不夠認真的一項證據", "104 欄位設計不良而需要重新改版的證據", "求職者不重視態度描述所造成的一項結果"], ans: _A0, exp: "同一份文件裡結構化欄位很具體，態度卻退回形容詞，落差本身就是證據。" },

  /* ===== M6 ===== */
  m6_nav: "6. 從 JD 到你的晨報：抽取規則怎麼寫",
  m6_title: "從 JD 到你的晨報：抽取規則怎麼寫",
  m6_overview: "最後一節把前五節收攏成一份可執行的分析規格。每一份 JD 產出五個欄位：兩個判定欄位（管理對象、層級）加上 K／S／A 三個能力欄位，每個判定都必須附上工作內容的原句作為依據。並訂一條品質門檻：「無法判定」比例超過三成，代表要修的是關鍵詞表，不是換模型。",
  m6_highlights: ["五欄輸出", "原句依據", "不採信職稱", "無法判定要誠實", "三成門檻", "Loop Engineering"],
  m6_p1: "先定義輸出。每一份 JD 產出一列紀錄，欄位為：來源連結、職稱原文（只作紀錄，不作依據）、管理對象（PM／PjM／無法判定）、層級（七階之一／無法判定）、K 條目、S 條目、A 條目（含四象限標記）、依據原句、抽取時間。特別注意「職稱原文只作紀錄」這一設計：它讓你事後可以統計「職稱與實際判定不一致」的比例，那正是第一節那個單向混用現象的量化版本。若你把職稱直接當成判定結果，這個最有價值的統計就永遠做不出來。",
  m6_p2: "規則的第一行永遠是：依據引用工作內容原句，不採信職稱。",
  m6_p3: "接著是抽取順序，順序會影響穩定度。第一步先做規則式的六欄：學歷要求與科系要求進 K；工作經歷、語文條件、擅長工具、工作技能進 S。這一步不需要語意能力，錯誤率應該接近零，若這一步出錯，代表你的欄位解析寫壞了，而不是判讀能力不足。第二步做軸一：掃描工作內容，計算偏 PM 與偏 PjM 判定詞的命中數，兩側相近就標無法判定。第三步做軸二：依序讀年資、管理責任欄位、工作內容動詞，衝突時以管理責任欄位為準。第四步才做 A：逐句掃「其他條件」與「工作內容」，抽出態度詞並標上四象限。把最不穩定的一步放在最後，前面的結果才不會被它污染。",
  m6_p4: "然後是品質門檻與回饋迴路，也就是 Loop Engineering 的實例。訂一個具體數字：任何一欄的「無法判定」比例超過三成，就停下來修規則，而不是繼續跑。以軸一為例，若二十份 JD 裡有七份判不出管理對象，最可能的原因是判定詞表漏了別名或漏了產業慣用語——例如漏收 PdM、PCC，或漏收某個產業把規格定義稱作「產品企劃」的說法。修法是：把那七份的工作內容原句抓出來，人工看一遍，找出反覆出現卻不在詞表裡的詞，補進詞表，然後重跑同一批資料。重跑之後無法判定比例應該明顯下降；若沒有下降，代表問題不在詞表，而在你的欄位切分或在樣本本身確實模糊。",
  m6_p5: "最後三個實作提醒。第一，無法判定要誠實標記，不要為了讓報表好看而硬塞。一份有三成無法判定但依據清楚的資料集，遠比一份百分之百有答案卻無法追溯的資料集有用。第二，依據原句要逐字保留、不要改寫，因為改寫會讓下一週的你無法判斷當時為什麼那樣判。第三，把這份規格寫進你的 KB，例如 KB/ksa_taxonomy.md，並在每次修改詞表時留下一行變更紀錄。你的晨報 Agent 之所以會越用越準，靠的不是模型變聰明，而是這份規格被你修過幾輪。",
  m6_wrapup: "一份可用的抽取規格長這樣：五個輸出欄位、每個判定附原句依據、職稱只記錄不採信。抽取順序從最穩定的規則式六欄開始，接著軸一判定詞計數、軸二三訊號互相驗證，最後才處理最不穩定的 A。品質門檻訂在三成——任何一欄的無法判定比例超過三成就停下來修關鍵詞表，補進漏收的別名與產業慣用語，然後重跑同一批資料看比例是否下降。這就是 Loop Engineering 在你期末專案裡最具體的樣子：規格、跑一輪、看指標、修規格、再跑一輪。把它寫進 KB，你的晨報才會越用越準。",
  m6_terms: [

    { front: "Loop Engineering", back: "規格、跑一輪、看指標、修規格、再跑一輪的迴路，讓產出越用越準。" },

    { q: "抽取規格中，職稱原文的正確處置方式是什麼？", opts: ["保留作紀錄但不作依據，用來統計名實不一致", "作為管理對象欄位的判定依據，其餘欄位不採用", "完全不要記錄，以免在後續分析中造成任何干擾", "僅在工作內容欄位從缺時，才拿來作判定的依據"], ans: _A0, exp: "保留職稱才能量化第一節提到的單向混用現象。" },

    { q: "當某一欄的「無法判定」比例超過三成時，正確做法是什麼？", opts: ["停下來修關鍵詞表，補詞後重跑同一批資料", "把無法判定的案例按比例分配到既有的分類中", "擴大樣本數，讓無法判定的比例自然被稀釋掉", "改以職稱作為備援依據，先把空白欄位填滿再說"], ans: _A0, exp: "三成門檻的用意就是逼你回頭修規則，而不是繼續累積壞資料。" },

  m0_nav: "0. Executive Summary",
  m0_title: "Executive Summary",
  m0_intro: "A job description is not an advertisement. It is a structured text that can be taken apart. This material does exactly one thing: it turns a 104 job posting, reliably, into two judgement fields and three competency dimensions. The two judgement fields are object of management and seniority — the first asks whether the role manages a product or a project, the second asks which rung it sits on between product specialist and chief product officer. The three competency dimensions are K for knowledge, S for skills and A for attitude. We take this route because the job title itself has no discriminating power: one search on 104 returns titles spanning product, project, engineering and sales work, and the very first hit is a sales operations role. The same abbreviation points to entirely different objects and entirely different rungs. So the first rule is set in module one: every judgement must quote a sentence from the duties or requirements fields, and no judgement may rest on the title. We then find that the 104 field structure has already written half the extraction rules for us — six structured fields map to K and S by rule, and only two fields need semantic reading. Finally, why A is the hardest is explained through four quadrants: upward, downward, inward and outward; the short version is that S carries evidence while A does not, so attitude retreats into free text and stays unobservable however carefully it is tagged. Along the way the material insists on one discipline that costs nothing and changes everything: mark a case undecidable when it genuinely is, and keep the sentence that produced every call, word for word. This page is also the analysis specification for your term-project morning-brief agent: by the end you should be able to write these rules into your own knowledge base, run them over a batch of twenty postings, read the undecidable share as a metric, and repair the keyword list rather than blaming the model.",
  m0_why: "Why read this in Week 7?",
  m0_why_desc: "Your term project builds an agent that reads job postings and produces a morning brief. The quality of that agent will never exceed the quality of its analysis specification. If the specification stops at \"pull out keywords\", the output is a pile of words nobody can compare. If it is precise about which field is rule-based, which needs semantic reading, which sentence must be quoted as evidence and how an undecidable case is marked, the output becomes data that accumulates week by week and can be compared across sources. This module gives you that specification. It is also material about you: take twenty postings apart into K, S and A and you will see, for the first time, what the market actually asks of a given rung rather than what you assume it asks.",

  /* ===== M1 ===== */
  m1_nav: "1. Why Job Titles Cannot Be Trusted",
  m1_title: "Why Job Titles Cannot Be Trusted",
  m1_overview: "One search on 104 for PM and project-management roles returns titles spanning product, project, engineering and sales work, and the first hit is a sales operations role. The same three letters point to different objects of management and different rungs. This module lays the phenomenon out, shows why any analysis that starts from the title fails at the first step, and introduces the two independent axes.",
  m1_highlights: ["A title is not evidence", "Same name, different work", "One-directional confusion", "Nominal PM, actual PjM", "Why two axes", "Quote the source sentence"],
  m1_p1: "Start with the material. In August 2026 a search on 104 returned titles including: PM Product Management Specialist, Product Management Specialist PM, Product Manager (PM) in Chinese, Product Manager (PM) in English, DRAM Product Management Specialist PM, Product Management Specialist / PM for OLED polarising film, Project Management Specialist (PM), PM Project Management Specialist / Manager, PM Project Management Engineer, Engineering Project Management trainee PM, Sales Project Management Specialist, Project Management Assistant / PM Assistant, and one posting titled simply PM. Across these nineteen results some manage products, some manage projects, some sit in engineering units and some in sales; some are assistants and some are managers. Their only common property is the two letters in the heading.",
  m1_p2: "A title is the employer's outward marketing language; the duties field is the language both parties actually have to deliver on.",
  m1_p3: "More importantly, the confusion is not random noise running both ways. It runs in one direction: in the overwhelming majority of cases the role is nominally a PM while the actual work is that of a PjM, and the reverse case is rare. There is a reason for the asymmetry. Product manager is the more attractive, easier-to-recruit label, so it is borrowed heavily for roles that are in substance project execution. For your analysis this asymmetry means something concrete: when you see a title containing PM, the prior probability leans towards project management, not product management. Classify by title and your dataset will systematically overstate how many product managers exist.",
  m1_p4: "So we change the starting point. This material uses two independent axes. Axis one asks whether the object of management is a product or a project. Axis two asks which rung of the seniority ladder the role occupies. Independent means that knowing one does not let you infer the other: a senior project manager and an entry-level product specialist sit at completely different coordinates on the pair. Collapsing them into a single line — for instance believing that PM is simply more senior than PjM — is the most common misconception in the local labour market and the main reason datasets come out distorted.",
  m1_p5: "In practice this module leaves one iron rule behind. Every judgement must be able to quote one sentence from the duties field or the requirements fields as its evidence, and the title may only serve as a hypothesis awaiting verification. If a posting talks throughout about schedules, milestones and cross-functional progress tracking, then on axis one it is a PjM even if the heading says product manager. Conversely, if the body mentions product profit and loss, pricing and product life cycle, it leans PM on axis one even when the heading only says project management specialist. This rule carries all the way to module six and becomes the first line of your extraction specification.",
  m1_wrapup: "This module proves one thing only: a job title is a label, not evidence. The same letters can point to four kinds of work, and the confusion runs one way — mostly nominal PM, actual PjM. Any statistic that starts from titles is therefore skewed at the first step. The fix is not a better list of titles but a different starting point: relocate every posting on two independent axes, object of management and seniority, and require every judgement to quote a sentence from the duties field as evidence. The next two modules make each axis precise enough to be written into code.",
  m1_terms: [
    { front: "Job Title", back: "The employer's outward label, shaped by recruiting convenience and internal grading. Not evidence about the work." },
    { front: "Same Name, Different Work", back: "One title pointing to entirely different duties across companies. PM is the textbook case." },
    { front: "One-Directional Confusion", back: "The mismatch is asymmetric: mostly nominal PM doing PjM work; the reverse is rare." },
    { front: "Prior Bias", back: "Classifying by title systematically overstates the number of product managers, because the confusion runs one way." },
    { front: "Two Independent Axes", back: "Axis one, object of management (product or project); axis two, seniority. Neither implies the other." },
    { front: "Source-Sentence Evidence", back: "Every judgement quotes one sentence from the duties or requirements fields; the title is only a hypothesis." }
  ],

    { q: "What does a single search for PM roles on 104 mainly demonstrate?", opts: ["The same three letters point to several quite different jobs", "The same three letters now carry one settled market meaning", "The same three letters appear only in engineering job titles", "The same three letters imply a narrow and consistent pay band"], ans: _A0, exp: "The letters span product, project, engineering and sales work, so the title has no discriminating power." },
    { q: "What does it mean that title confusion runs in one direction?", opts: ["Most are nominally PM while the real work is project management", "Most are nominally PjM while the real work is product management", "Both titles borrow from each other at roughly the same rate here", "Only foreign firms mix them, while local firms stay quite precise"], ans: _A0, exp: "Product manager is the easier label to recruit with, so it is borrowed for execution roles." },
    { q: "Why can a JD analysis not classify a role by its job title?", opts: ["A title is the employer's outward label, not evidence of the work", "A title is approved centrally and therefore updates far too slowly", "A title is an optional 104 field that is very often left blank here", "A title correlates with pay bands and so biases the reading of it"], ans: _A0, exp: "The title is only a hypothesis; the evidence has to come from the duties field." },
    { q: "The first hit was a sales operations role. What does that show?", opts: ["Keyword matching on the platform returns unrelated postings too", "Sales operations and product management have in practice merged", "The platform now ranks results by a strict competency taxonomy", "English titles describe the object of management more precisely"], ans: _A0, exp: "The platform matches keywords, so the returned list already contains unrelated postings." },
    { q: "If titles cannot be trusted, where should the reading go for evidence?", opts: ["To the wording of the duties and requirement fields themselves", "To company size and capital as the basis for making inferences", "To the benefits and leave policy describing the style of working", "To the department named in the contact block at the very bottom"], ans: _A0, exp: "The iron rule is that every judgement quotes a source sentence; a title does not count." },
    { q: "Why is one axis not enough, and two independent axes required?", opts: ["Object and seniority vary separately, so one axis distorts both", "Two axes make the output line up with published pay band tables", "The 104 field structure itself requires two attributes to be filled", "Two axes simply make the extraction script rather easier to write"], ans: _A0, exp: "A senior PjM and an entry-level product specialist sit at very different coordinates." }

  /* ===== M2 ===== */
  m2_nav: "2. Axis One — Object of Management: PM or PjM",
  m2_title: "Axis One — Object of Management: PM or PjM",
  m2_overview: "Axis one asks a single question: does this role manage a product or a project? A PM is a product manager, doing product management, whose object is the product; aliases are PdM and PDM. A PjM is a project manager, doing project management, whose object is the project; aliases are PJM and PCC. The boundary between them is not a vague sense of division of labour but a specific gate in the new product development flow: the kick-off gate.",
  m2_highlights: ["Object is the product", "Object is the project", "RPM / TPM / OPM", "Kick-off gate", "Keyword criteria", "PdM and PCC aliases"],
  m2_p1: "Pin the definitions down first. A PM does product management, and the object is a product — a line of goods with profit and loss, a life cycle, versions and an end-of-life plan. A PjM does project management, and the object is a project — any package of work with a start, an end, a scope and deliverables. That package may be a whole product development programme or only one part of it. The distinction sounds fine-grained but it decides what the person watches every day. A PM watches whether this product should be built at all, what shape it takes, who buys it and whether it makes money. A PjM watches how, given that the decision has been made, it gets delivered within the limits of time, resource and quality.",
  m2_p2: "The boundary is the kick-off gate of new product development: a PM owns everything up to spec sign-off, a PjM owns execution after sign-off.",
  m2_p3: "PjM has three common variants named after the unit that owns them: RPM on the research and development side, TPM on the engineering side, and OPM on the production side. Note carefully that these three are branches beneath the PjM line, not a third, fourth and fifth line running parallel to PM. The mistake students make most often is treating TPM as a technical flavour of product manager and filing it under PM, which distorts the whole distribution on axis one. The test is simple: if the object is a package of work with a start and an end, then whether it sits in research, engineering or production, it belongs on the PjM side.",
  m2_p4: "Then come the operational keyword criteria. Words leaning PM include roadmap, product life cycle, product profit and loss, market requirement, competitive analysis, pricing, specification definition and end of life. Words leaning PjM include schedule, milestone, resource allocation, risk control, cross-functional coordination, progress tracking, delivery acceptance, and work breakdown structure or Gantt chart. In practice do not decide on a single hit. Scan the whole duties field, count hits on each side, and see which side is clearly ahead. If both sides hit and the counts are close, this is most likely a hybrid role: mark it undecidable and keep one source sentence from each side in the evidence column rather than forcing it into a box.",
  m2_p5: "Two final points that affect data quality. First, collect the aliases: PdM and PDM are PM, while PJM and PCC are PjM, and a keyword list that omits aliases will generate a great many needless undecidable cases. Second, always quote the source sentence. Your output should not be the three letters PjM on their own but something like: PjM — evidence: duties item 3, \"responsible for cross-functional progress tracking and milestone control\". Only a judgement with a source sentence can be checked by a teammate, and only such a judgement lets you go back next week and correct the keyword list.",
  m2_wrapup: "Axis one is the foundation of the whole analysis and the axis most easily bent by the title. Three things are enough. First, the criterion is the object of management, product or project, not what the heading says. Second, the boundary is the kick-off gate: a PM owns everything up to spec sign-off, a PjM owns execution afterwards, which turns a vague sense of division into an identifiable gate. Third, RPM, TPM and OPM are PjM variants rather than lines parallel to PM, and asking whether the object is a bounded package of work places them at once. In practice, scan the whole duties field with the keyword criteria, count both sides, keep the source sentence, and mark undecidable honestly when the counts are close.",
  m2_terms: [
    { front: "PM, Product Manager", back: "Does product management; the object is the product: profit and loss, life cycle, versions and end-of-life plan. Aliases PdM, PDM." },
    { front: "PjM, Project Manager", back: "Does project management; the object is the project: a package of work with start, end, scope and deliverables. Aliases PJM, PCC." },
    { front: "Kick-off Gate", back: "The boundary on axis one. A PM owns everything up to spec sign-off; a PjM owns execution afterwards." },
    { front: "RPM / TPM / OPM", back: "PjM variants named after the owning unit: research and development, engineering, production. All sit on the PjM side." },
    { front: "PM-Leaning Keywords", back: "Roadmap, product life cycle, product profit and loss, market requirement, competitive analysis, pricing, spec definition, end of life." },
    { front: "PjM-Leaning Keywords", back: "Schedule, milestone, resource allocation, risk control, cross-functional coordination, progress tracking, delivery acceptance, WBS or Gantt." }
  ],
  m2_q: [
    { q: "What is axis one, object of management, actually asking?", opts: ["Whether the role manages a product or a bounded project", "Which level of manager the role reports to on the org chart", "Which industry the employer is in and how large its capital is", "How many years of experience are needed to be hired into it"], ans: _A0, exp: "Axis one asks only about the object of management; everything else sits elsewhere." },
    { q: "Where does the boundary between PM and PjM fall in the NPD flow?", opts: ["The kick-off gate: PM up to spec sign-off, PjM after that", "The launch day itself: PM before launch, PjM after launch", "The engineering pilot run: PM before it, PjM after the run", "The end-of-life moment: PM before it, PjM after retirement"], ans: _A0, exp: "The kick-off gate turns a vague division of labour into an identifiable gate." },
    { q: "Where do RPM, TPM and OPM correctly sit in the two-axis model?", opts: ["They are three common PjM variants named by owning unit", "They are a third main line running parallel to PM and PjM", "They are product managers stationed in three different units", "They are transitional rungs between junior and senior grade"], ans: _A0, exp: "All three manage bounded packages of work, so all three sit on the PjM side." },
    { q: "Which set of words pushes a posting towards the PM side?", opts: ["Product profit and loss, life cycle, pricing, competitor study", "Milestone, resource allocation, risk control, progress tracking", "Attendance control, training plans, internal audit and appraisal", "Supplier negotiation, warehouse turnover, obsolete stock write-off"], ans: _A0, exp: "These all point to the value and life cycle of the product itself." },
    { q: "If both sides of the keyword criteria hit at similar counts, what is right?", opts: ["Mark it undecidable and keep one source sentence from each side", "Let the title decide, using whichever of product or project it says", "Take the first entry of the job-category field as the final verdict", "Assign it to PjM, since the confusion in the market runs one way"], ans: _A0, exp: "Forcing it into a box manufactures false data; honest marking lets you fix the list later." },
    { q: "Why must the extraction keyword list always include the aliases?", opts: ["Omitting PdM or PCC needlessly inflates the undecidable share", "Aliases can be used directly to infer which rung a role sits on", "The number of aliases reflects how mature the employer's system is", "Aliases are a mandatory field within the 104 posting structure now"], ans: _A0, exp: "PdM and PDM are PM, PJM and PCC are PjM; omitting them turns decidable cases undecidable." }
  ],

  /* ===== M3 ===== */
  m3_nav: "3. Axis Two — Seniority: From Specialist to CPO",
  m3_title: "Axis Two — Seniority: From Specialist to CPO",
  m3_overview: "Axis two asks which rung the role occupies. The full ladder runs: PM Specialist, PM Engineer, Junior PM, Senior PM, PM Director, VP or SVP of PM, and CPO. Seniority is not only about pay. It systematically reshapes what a posting asks of all three dimensions, K, S and A.",
  m3_highlights: ["Seven rungs", "Years as a signal", "Management responsibility field", "Ladder of verbs", "Three entry rungs", "Collect every rung"],
  m3_p1: "Lay the seven rungs out. A product specialist is the entry rung, usually handling data consolidation, reporting and acting as a window to other units. A product engineer leans towards technical support and specification documents. A junior product manager begins to own a small product line or a module alone. A senior product manager answers for product profit and loss and has to make trade-offs. A product director runs a group of product lines and a group of product managers. A vice president answers for the whole product portfolio and its strategy. A chief product officer joins the executive team and deals with product strategy and resource allocation at company level. Not every firm has all seven, but mapping the titles you observe back onto these seven is what gives cross-company comparison a common scale.",
  m3_p2: "Seniority is not a synonym for salary. It is the scale of how large a decision this person is permitted to make.",
  m3_p3: "How does seniority reshape K, S and A? Take K first. At entry level the knowledge asked for is basic — the right degree subject, industry fundamentals, common terminology. By senior and director level the knowledge shifts towards industry structure, regulation and business models, and it often stops being written down at all because it is assumed. Now S, the dimension that changes most violently. Years of experience are themselves an S signal, because years act as evidence of being able to complete the task; and tool skills shift from operational ones such as reporting, presenting and data consolidation towards decision ones such as profit-and-loss modelling, portfolio trade-offs and cross-functional negotiation. Finally A. At entry level the attitude words are mostly inward and upward — report proactively, cope with pressure, cooperate. Only at director level and above do downward attitude words appear in quantity, because that is where the management responsibility field usually says yes.",
  m3_p4: "How do you read seniority off a posting? Look at three signals together. First, the years of experience entry inside the requirements group: under two years is usually specialist or engineer, three to five years lands between junior and senior product manager, and eight or more is where director level appears. Second, the management responsibility field, where 104 states plainly whether the role manages staff and how many — the hardest evidence of seniority there is. Third, the verbs in the duties field: execute, assist and coordinate are low; define, formulate and decide are middle; lead a team, build a system and answer for organisational performance are high. When the three signals conflict, let the management responsibility field win, because it is a structured field and the hardest to inflate.",
  m3_p5: "Two closing notes for practice. First, collect every rung without filtering. Students routinely keep only the rungs they could realistically apply for, which hides both the full ladder and the answer to the question of what the next rung up actually demands. Collect everything and you discover that what grows between junior and senior is usually not knowledge but decision responsibility. Second, be clear about your real entry point: for undergraduates and fresh master's graduates the reachable rungs are the first three — product specialist, product engineer and junior product manager. You should still collect and read the postings above rung three, but those are for planning a three-to-five-year path, not for comparing against today.",
  m3_wrapup: "Axis two replaces a vague adjective like senior with a ruler carrying seven marks. From product specialist up to chief product officer, each rung shifts K from written to assumed, S from operational to decisional, and A from upward and inward outwards to include downward. Read seniority from three signals: years of experience, the management responsibility field and the verbs in the duties field, letting the management responsibility field win when they conflict because it is hardest to inflate. In practice collect every rung so the full ladder is visible, while knowing clearly that your own entry point is the first three rungs and the rest is path information rather than a comparison set for today.",
  m3_terms: [
    { front: "Seven-Rung Ladder", back: "PM Specialist, PM Engineer, Junior PM, Senior PM, PM Director, VP or SVP of PM, CPO." },
    { front: "Years as a Signal", back: "The years-of-experience entry in the requirements group. The commonest seniority signal, and evidence for S." },
    { front: "Management Responsibility Field", back: "A structured 104 field stating whether staff are managed and how many. The hardest evidence of seniority." },
    { front: "Ladder of Verbs", back: "Execute and coordinate (low), define and decide (middle), lead a team and build a system (high)." },
    { front: "Three Entry Rungs", back: "Product specialist, product engineer, junior product manager. Higher rungs are collected for path planning." },
    { front: "Collect Every Rung", back: "Keeping all seniority levels in the dataset is what makes the full ladder, and each step up, visible." }
  ],
  m3_q: [
    { q: "On the ladder used in this course, what are the bottom and top rungs?", opts: ["Bottom is product specialist and top is chief product officer", "Bottom is junior product manager and top is product director", "Bottom is product engineer and top is vice president of PM", "Bottom is project management assistant and top is senior PM"], ans: _A0, exp: "The seven rungs run specialist, engineer, junior, senior, director, VP and CPO." },
    { q: "Which seniority signal in a posting is the hardest to inflate?", opts: ["The management responsibility field, structured and explicit", "Words such as senior, lead or deputy that decorate the title", "The salary or annual package band shown in the pay field", "The share options and bonus terms listed under benefits"], ans: _A0, exp: "When the three signals conflict the structured field wins precisely because it is explicit." },
    { q: "As seniority rises, what happens to the K knowledge dimension?", opts: ["It shifts from written basics to being assumed and unwritten", "It shifts from assumed background to ever more detailed lists", "It stays fixed in the degree and subject fields at every rung", "It moves into the language field, leaving degree and subject"], ans: _A0, exp: "At senior levels knowledge is presupposed, so it disappears from the text." },
    { q: "How do the verbs in the duties field reflect seniority?", opts: ["Execute is low, define is middle, lead a team is high", "Execute is high, define is middle, lead a team is low", "Verbs show only the object of management, not the rung", "Verbs show only industry differences and never the rung"], ans: _A0, exp: "The ladder of verbs runs from executing to deciding to leading an organisation." },
    { q: "For a fresh graduate, which three rungs are realistically reachable?", opts: ["Product specialist, product engineer and junior product manager", "Junior product manager, senior product manager and director", "Product engineer, senior product manager and vice president", "Product specialist, senior product manager and product officer"], ans: _A0, exp: "The first three rungs are the real entry point; higher ones are for path planning." },
    { q: "Why should every seniority level be collected without filtering?", opts: ["Only then are the full ladder and each step up made visible", "Only then does the sample reach the threshold for a stat test", "Because 104 search results cannot be filtered by rung anyway", "Because the rung field is optional and filtering empties the set"], ans: _A0, exp: "Keeping only reachable rungs hides what the next rung up actually demands." }
  ],

  /* ===== M4 ===== */
  m4_nav: "4. The 104 Field Structure Is Half a Rule Set",
  m4_title: "The 104 Field Structure Is Half a Rule Set",
  m4_overview: "The good news is that a 104 posting is already structured. It cuts information into fixed fields, which amounts to writing half your extraction rules for you. The bad news is that it is only half: six structured fields map to K and S by rule, but the other conditions field and the duties field still need semantic reading — and A hides almost entirely inside those two.",
  m4_highlights: ["Full field structure", "Six rule-based fields", "Two semantic fields", "Years belong to S", "Management responsibility", "Operational K/S/A"],
  m4_p1: "See the whole structure first. The main fields of a 104 posting run: duties, job category, pay, employment type, work location, remote work, management responsibility, travel and posting, working hours, leave policy, availability date and headcount. Then comes the requirements group, containing years of experience, education, subject of study, language, tools, work skills and other conditions. Benefits and contact details close the page. The greatest value of seeing this table whole is that you no longer have to invent your own segmentation rules — the platform has already segmented the text for you.",
  m4_p2: "Structured fields are where the employer is forced to be specific; free-text fields are where the employer is free to be vague.",
  m4_p3: "Now the mapping. Education and subject of study map to K, because they describe the knowledge base of the field and can be extracted by rule. Years of experience maps to S — and this is the point most often got wrong. Many people put years under K on the intuition that a longer career means knowing more. But in a posting the function of years is not to describe what is known; it is to serve as evidence of being able to complete the task, so it belongs to S. Language, tools and work skills map to S as well, again by rule. Up to this point six fields need no semantic model at all: mapping by field name is enough.",
  m4_p4: "The remaining two fields need semantic reading. Other conditions is mostly A but mixed, frequently carrying attitude words, nice-to-have skills and notes on the style of working all at once, so it has to be read sentence by sentence. Duties contains all three dimensions: it describes the product or project to be owned, giving evidence for axis one; it hints at seniority through its verbs, giving evidence for axis two; and it carries knowledge and skill requirements along the way. These two fields are the only place in your agent that genuinely needs semantic ability; the other six run reliably on rules. That split matters because it tells you where errors will appear, and which part to fix when the undecidable share climbs.",
  m4_p5: "One more ruler for telling K from S, which module five reuses. K is knowledge and answers what is known. S is skill and answers what can be done, with evidence. A is attitude and answers how someone tends to behave. Years, tools and language test scores all have evidence, so they are S; education and subject describe the knowledge base, so they are K. As for A, its defining feature is precisely the absence of evidence, which is the problem the next module takes up. One caution: the management responsibility field is structured but does not map directly to K or S. Its use is to predict whether the downward quadrant of A will appear at all.",
  m4_wrapup: "The 104 field structure is a ready-made skeleton for your extraction rules. Education and subject go to K; years of experience, language, tools and work skills go to S — years belong to S because they are evidence of being able to complete the task, not knowledge itself. What remains, other conditions and duties, needs semantic reading: the former is mostly A but mixed, the latter carries all three dimensions and supplies the evidence for both axes. Write this split into your specification and you will know that those six rule-based fields should almost never be wrong, so that when the error rate rises the problem is certainly in the semantic reading of the other two.",
  m4_terms: [
    { front: "Requirements Group", back: "Contains years of experience, education, subject, language, tools, work skills and other conditions." },
    { front: "Rule-Based Mapping", back: "Six structured fields map to K or S directly by field name, needing no semantic model." },
    { front: "Years Belong to S", back: "Years function as evidence of being able to complete the task, not as a description of knowledge." },
    { front: "Other Conditions Field", back: "Mostly A, but mixed with nice-to-have skills and working style, so it must be read sentence by sentence." },
    { front: "Duties Field", back: "Carries all three of K, S and A, and supplies evidence for both axis one and axis two." },
    { front: "Management Responsibility", back: "Structured but not mapped to K or S; its use is predicting whether the downward quadrant of A appears." }
  ],
  m4_q: [
    { q: "Why is the 104 field structure called half a set of extraction rules?", opts: ["Six structured fields map directly, but two need semantic reading", "Every field maps directly, so no semantic reading is ever required", "Every field needs semantic reading, so the structure gives no help", "The structure only helps with pay analysis, not with competencies"], ans: _A0, exp: "Six by rule and two by semantics is precisely what half a rule set means." },
    { q: "In the K, S and A mapping, where do years of experience belong?", opts: ["To S, because years are evidence of being able to do the task", "To K, because a longer career naturally means knowing more", "To A, because years mainly reflect how stable a candidate is", "To K and S at once, because years carry both of those senses"], ans: _A0, exp: "Years function as evidence rather than as knowledge content, so they sit in S." },
    { q: "Which pair of fields maps by rule to the K knowledge dimension?", opts: ["Education requirement and subject of study", "Tools mastered and the work skills listed", "The duties field and other conditions field", "Management responsibility and the headcount"], ans: _A0, exp: "These two describe exactly the knowledge base of the field in question." },
    { q: "Which two fields are the only ones needing semantic reading?", opts: ["Other conditions and duties", "Education and subject of study", "Language condition and tools", "Pay package and the benefits"], ans: _A0, exp: "Other conditions is mostly A but mixed; duties carries all three dimensions." },
    { q: "What is the correct use of the management responsibility field here?", opts: ["Predicting whether the downward quadrant of A appears", "Mapping it directly into an entry of the K dimension", "Mapping it directly into an entry of the S dimension", "Replacing years of experience as the source of tenure"], ans: _A0, exp: "It is structured but not mapped; its value lies in predicting downward attitude words." },
    { q: "What is the most practical ruler for telling K from S?", opts: ["K answers what is known, S what can be done with evidence", "K answers what can be done, S what is known with evidence", "K sits in free-text fields while S sits in structured fields", "K is only about degree level and S only about career length"], ans: _A0, exp: "Whatever carries evidence is S; whatever describes a knowledge base is K." }
  ],

  /* ===== M5 ===== */
  m5_nav: "5. Why A Is Hardest: Quadrants and Unobservability",
  m5_title: "Why A Is Hardest: Quadrants and Unobservability",
  m5_overview: "K and S each have fields to map from. A does not. It is scattered through the free text of other conditions and duties, and it mostly appears as adjectives nobody can verify. This module offers a structure — the upward, downward, inward and outward quadrants — so that A can at least be classified, while asking you to stay sceptical about that structure itself.",
  m5_highlights: ["S has evidence, A does not", "Four quadrants", "The empty downward cell", "Predictive management field", "Retreat into free text", "Keep the critique yours"],
  m5_p1: "Draw the line first. The most practical ruler for telling S from A is that S has evidence and A does not. A language test score is evidence; being able to operate a given system is evidence; three years on a product line is evidence. Resilient under pressure, proactive and a team player have no verifiable counterpart at all. This does not mean attitude is unimportant. It means attitude is unobservable at the level of the text. When your agent extracts A, what it actually extracts is the employer's preferred self-description, not the standard the employer will really screen by. Keep that distinction in view or you will produce an A list that looks rich and carries no information.",
  m5_p2: "Employers are extremely specific when filling structured fields and retreat into free text the moment attitude comes up — that retreat is itself the evidence that A is unobservable.",
  m5_p3: "Now the quadrants. Sort A by the counterpart of the interaction into four cells. Upward faces the manager: reporting proactively, taking on assignments, not hiding bad news. Downward faces subordinates: mentoring newcomers, developing team members, allocating tasks. Inward faces peers and other functions: collaborating, covering for colleagues, not passing the blame. Outward faces customers and suppliers: service enthusiasm, patient explanation, external coordination. The value of the quadrants is not the classification itself but that they make absence visible. You will notice very quickly that in postings without management duties, the downward cell is almost always empty.",
  m5_p4: "Why empty? Because a downward attitude only means anything when the person genuinely leads people, and whether they lead people is written in the structured management responsibility field. That yields a testable prediction: postings where management responsibility says no will almost never carry downward attitude words, while postings that say yes with a headcount above zero will carry them markedly more often. This prediction is worth testing on your own dataset. If it holds, you gain an inference you can write into your rules. If it does not, that is even more interesting, because it means some employers in your sample recruit with the language of leading people for roles that lead nobody.",
  m5_p5: "Finally, stay sceptical about the quadrants themselves. They are a convenient classification, not a validated theory of competence. At least three problems deserve raising in your group discussion. First, one attitude phrase may fall into two cells at once — cross-functional coordination is inward and can be outward too — and forcing a single choice manufactures false precision. Second, the quadrants describe the counterpart of an interaction but not its intensity or context, so two postings with identical A lists may demand wildly different things. Third, and most fundamental: if A is unobservable at the level of the text, what problem is solved by extracting it? This module does not answer that. It is yours to face in the term project.",
  m5_wrapup: "A is the hardest of the three dimensions because it has no field, no evidence and only adjectives. The quadrants — upward, downward, inward, outward — give a structure that makes absence visible: the downward cell of a non-managerial posting is almost always empty, and that emptiness can be predicted from the structured management responsibility field, an inference you can test on your own dataset. But the quadrants are not a theory: one phrase may span two cells, the cells say nothing about intensity, and the deepest question stays open — once something unobservable has been extracted, what decision can it support? Bringing that question into your group discussion is worth far more than memorising four labels.",
  m5_terms: [
    { front: "Ruler for S and A", back: "S has evidence, A does not. Test scores and tool use are evidence; resilience and drive have no counterpart." },
    { front: "The Four Quadrants of A", back: "Sorted by the counterpart of the interaction: upward, downward, inward and outward." },
    { front: "The Empty Downward Cell", back: "In non-managerial postings the downward quadrant is almost always empty, because leading nobody needs no such attitude." },
    { front: "Predictive Management Field", back: "When management responsibility says yes with a headcount above zero, downward attitude words appear markedly more often." },
    { front: "Retreat into Free Text", back: "Employers are specific in structured fields and vague on attitude, and that contrast is the evidence of unobservability." },
    { front: "Limits of the Quadrants", back: "A phrase may span two cells and the cells ignore intensity and context, so forcing one choice invents false precision." }
  ],
  m5_q: [
    { q: "What is the most practical ruler for telling S skills from A attitude?", opts: ["S carries verifiable evidence while A has no counterpart", "S sits in free text while A sits in the structured fields", "S concerns only tools while A concerns only the languages", "S is set by education while A is set by length of service"], ans: _A0, exp: "Test scores, tool use and years are evidence; resilience and drive are not." },
    { q: "On what basis are the four quadrants of A divided?", opts: ["By the counterpart that the attitude is directed towards", "By how intensely the attitude is demanded in the posting", "By which field of the posting the attitude appears within", "By whether the attitude can be quantified and measured"], ans: _A0, exp: "The quadrants are upward, downward, inward and outward, sorted by counterpart." },
    { q: "In a non-managerial posting, which quadrant is almost always empty?", opts: ["Downward, because leading nobody needs no such attitude", "Upward, because reporting to a manager is simply assumed", "Inward, because collaboration is already in the duties field", "Outward, because customer-facing work is posted separately"], ans: _A0, exp: "Downward attitudes only mean something when the person genuinely leads people." },
    { q: "Which structured field predicts whether the downward quadrant appears?", opts: ["Management responsibility, stating staff managed and count", "Employment type, stating whether the post is full or part time", "Headcount, stating how many people this round will recruit", "Working hours, stating whether the post is shift or day work"], ans: _A0, exp: "Yes with a headcount above zero markedly raises the odds of downward attitude words." },
    { q: "Employers retreat into free text on attitude. What is that treated as?", opts: ["Practical evidence that A is unobservable at text level", "Evidence that employers fill postings in carelessly overall", "Evidence that the 104 field design is poor and needs work", "A result of job seekers ignoring attitude descriptions here"], ans: _A0, exp: "Specific structured fields beside vague adjectives — the contrast is itself the evidence." },
    { q: "What stance does this module want you to take towards the quadrants?", opts: ["Use them as a convenient tool while questioning their limits", "Treat them as a validated theory and apply them unquestioned", "Abandon them entirely, since attitude cannot be classified", "Use them in presentations only and never in real extraction"], ans: _A0, exp: "A phrase may span two cells and the cells ignore intensity; raise those limits actively." }
  ],

  /* ===== M6 ===== */
  m6_nav: "6. From JD to Your Morning Brief",
  m6_title: "From JD to Your Morning Brief: Writing the Extraction Rules",
  m6_overview: "The last module gathers the previous five into an executable analysis specification. Every posting yields five columns: two judgement columns, object of management and seniority, plus the three competency columns K, S and A, with every judgement carrying a quoted source sentence. One quality threshold is set: when undecidable cases pass thirty per cent, the thing to fix is the keyword list, not the model.",
  m6_highlights: ["Five-column output", "Quoted evidence", "Never trust the title", "Be honest about undecidable", "The thirty per cent line", "Loop engineering"],
  m6_p1: "Define the output first. Each posting yields one row with these columns: source link, title as written (recorded only, never used as evidence), object of management (PM, PjM or undecidable), seniority (one of seven rungs or undecidable), K entries, S entries, A entries with quadrant tags, quoted source sentence, and extraction timestamp. Note the design choice that the title is recorded but not used. It lets you afterwards compute how often the title and the actual judgement disagree — the quantified version of the one-directional confusion from module one. If you let the title be the judgement, that most valuable statistic can never be produced.",
  m6_p2: "The first line of the specification is always: quote the duties field as evidence, and never trust the title.",
  m6_p3: "Then the order of extraction, which affects stability. Step one runs the six rule-based fields: education and subject into K; years, language, tools and work skills into S. This step needs no semantic ability and its error rate should be close to zero, so if it does go wrong your field parsing is broken rather than your judgement being weak. Step two handles axis one: scan the duties field, count hits for PM-leaning and PjM-leaning criteria, and mark undecidable when the counts are close. Step three handles axis two: read years, then the management responsibility field, then the verbs, letting the structured field win on conflict. Only step four handles A, reading other conditions and duties sentence by sentence and tagging each attitude word with a quadrant. Put the least stable step last and the earlier results stay uncontaminated.",
  m6_p4: "Then the quality threshold and the feedback loop, which is loop engineering made concrete. Set a specific number: whenever the undecidable share of any column passes thirty per cent, stop and repair the rules instead of running on. Take axis one. If seven of twenty postings yield no object of management, the likeliest cause is that the keyword list is missing aliases or industry idiom — omitting PdM and PCC, say, or missing an industry that calls specification definition product planning. The repair is to pull the duties text of those seven, read them by hand, find the words that recur but are absent from the list, add them, and rerun the same batch. The undecidable share should then fall visibly. If it does not, the problem is not the list but your field parsing, or genuine ambiguity in the sample.",
  m6_p5: "Three closing notes for practice. First, mark undecidable honestly and never force a case in to make the report look complete. A dataset with thirty per cent undecidable and clear evidence is far more useful than one with an answer everywhere and no traceability. Second, keep the quoted sentence word for word without rewriting, because a rewrite means that next week you can no longer tell why the call was made. Third, write this specification into your knowledge base, for instance as KB/ksa_taxonomy.md, and leave one line of change history every time the keyword list is edited. Your morning-brief agent gets more accurate not because the model gets cleverer but because this specification has been through several rounds of repair.",
  m6_wrapup: "A usable extraction specification looks like this: five output columns, a quoted source sentence behind every judgement, and the title recorded but never trusted. Extraction runs from the most stable step first — the six rule-based fields — then axis-one keyword counting, then axis two with its three cross-checking signals, and only then the least stable dimension, A. The quality threshold sits at thirty per cent: whenever any column passes it, stop, repair the keyword list with the missing aliases and industry idiom, and rerun the same batch to see whether the share falls. That is the most concrete form loop engineering takes in your term project: specify, run, read the metric, repair, run again. Write it into your knowledge base and the brief gets sharper every week.",
  m6_terms: [
    { front: "Five-Column Output", back: "Object of management and seniority as judgement columns, plus K, S and A, each row carrying quoted evidence." },
    { front: "Title Recorded Only", back: "The title is kept but never used as evidence, so the mismatch rate can be measured afterwards." },
    { front: "Order of Extraction", back: "Six rule-based fields, then axis-one keyword counts, then axis-two signals, and A last." },
    { front: "Thirty Per Cent Line", back: "When any column passes thirty per cent undecidable, stop and repair the keyword list rather than running on." },
    { front: "Loop Engineering", back: "Specify, run, read the metric, repair, run again — the loop that makes the output sharper over time." },
    { front: "ksa_taxonomy.md", back: "The knowledge-base file holding the extraction rules, with one line of change history per edit." }
  ],
  m6_q: [
    { q: "How should the job title as written be handled in the specification?", opts: ["Recorded but never used, so mismatch rates can be measured", "Used as the evidence for the object of management column", "Left out entirely so that it cannot disturb later analysis", "Used as evidence only when the duties field is left empty"], ans: _A0, exp: "Keeping the title is what lets you quantify the one-directional confusion." },
    { q: "What is the correct order of the four extraction steps?", opts: ["Six rule fields, axis one counts, axis two signals, then A", "A first, then axis two signals, axis one counts, rule fields", "Axis one counts, then A, then the rule fields, then axis two", "Axis two signals, then rule fields, then A, then axis one"], ans: _A0, exp: "Putting the least stable step last keeps the earlier results uncontaminated." },
    { q: "If the six rule-based fields go wrong, what is the likeliest cause?", opts: ["The field parsing is broken, not weak semantic judgement", "Semantic judgement is weak and a larger model is required", "The sample is inherently vague, so the error is unavoidable", "The keyword list is missing aliases such as PdM and PCC"], ans: _A0, exp: "Those six map by field name and need no semantics, so errors should be near zero." },
    { q: "When a column passes thirty per cent undecidable, what is correct?", opts: ["Stop, repair the keyword list, and rerun the same batch", "Spread the undecidable cases across the existing classes", "Enlarge the sample so the undecidable share is diluted", "Fall back on the title to fill the blank columns for now"], ans: _A0, exp: "The threshold exists to force repair rather than accumulate bad data." },
    { q: "Why must the quoted source sentence be kept word for word?", opts: ["Rewriting means you cannot later tell why the call was made", "Rewriting makes the CSV column widths become inconsistent", "Rewriting may infringe the reproduction right in copyright", "Rewriting invalidates the keyword hit counts in the report"], ans: _A0, exp: "Traceability is the core of this specification and rewriting destroys the trail." },
    { q: "What concrete shape does loop engineering take in this module?", opts: ["Specify, run, read the metric, repair, then run once more", "Specify, run, swap the model, run again, read the metric", "Run, enlarge the sample, run again, and write rules last", "Write the rules, run everything once, and never edit them"], ans: _A0, exp: "Accuracy comes from how many rounds the specification has been repaired." }
  ],

/* ==================== FlipCardDeck ==================== */
const FlipCardDeck = ({ terms, t, moduleId, onCardRead }) => {
  const [groupIdx, setGroupIdx] = useState(0);
  const [flipped, setFlipped] = useState({});
  const [readSet, setReadSet] = useState(new Set());
  const [shownSet, setShownSet] = useState(new Set());

  const [shuffledOrder] = useState(() =>
    [...Array(terms.length).keys()].sort(() => Math.random() - 0.5)
  );

  const groupSize = 2;
  const totalGroups = Math.ceil(terms.length / groupSize);
  const startIdx = groupIdx * groupSize;
  const currentCardIndices = shuffledOrder.slice(startIdx, startIdx + groupSize);

  useEffect(() => {
    const newShown = new Set(shownSet);
    currentCardIndices.forEach(idx => newShown.add(idx));
    if (newShown.size !== shownSet.size) setShownSet(newShown);
  }, [groupIdx]);

  const handleFlip = (origIdx) => {
    setFlipped(f => ({ ...f, [origIdx]: !f[origIdx] }));
    if (!readSet.has(origIdx)) {
      const newRead = new Set(readSet); newRead.add(origIdx); setReadSet(newRead);
      if (onCardRead) onCardRead(moduleId, newRead.size, shownSet.size, terms.length);
    }
  };

  const statusText = t.flip_status
    .replace('{read}', readSet.size).replace('{shown}', shownSet.size).replace('{total}', terms.length);

  return (
    <div className="mt-8">
      <h3 className="text-lg font-bold uppercase tracking-wider text-slate-500 mb-2">{t.key_terms}</h3>
      <p className="text-sm text-slate-400 mb-4">{statusText}</p>
      <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
        {currentCardIndices.map((origIdx) => {
          const term = terms[origIdx];
          return (
            <div key={origIdx} className="perspective cursor-pointer h-40" onClick={() => handleFlip(origIdx)}>
              <div className={`transform-style-3d relative w-full h-full transition-transform duration-500 ${flipped[origIdx] ? 'rotate-y-180' : ''}`}>
                <div className="backface-hidden absolute inset-0 bg-white dark:bg-slate-800 rounded-xl p-4 flex flex-col items-center justify-center border border-slate-200 dark:border-slate-700 shadow-sm">
                  <p className="font-serif font-bold text-center text-[#004030] dark:text-[#D8C3A5]">{term.front}</p>
                  <p className="text-xs text-slate-400 mt-2">{t.flip_prompt}</p>
                </div>
                <div className="backface-hidden rotate-y-180 absolute inset-0 bg-[#004030] dark:bg-slate-700 rounded-xl p-4 flex items-center justify-center">
                  <p className="text-sm text-center text-[#D8C3A5] dark:text-slate-200 leading-relaxed">{term.back}</p>
                </div>
              </div>
            </div>
          );
        })}
      </div>
      <div className="flex items-center gap-3 mt-4">
        <button onClick={() => { setGroupIdx(0); setFlipped({}); }}
          className="px-4 py-2 text-sm border border-slate-300 dark:border-slate-600 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-700">
          {t.flip_retry}
        </button>
        <button onClick={() => groupIdx < totalGroups - 1 && setGroupIdx(groupIdx + 1)}
          disabled={groupIdx >= totalGroups - 1}
          className="px-4 py-2 text-sm bg-[#004030] dark:bg-[#D8C3A5] text-white dark:text-[#004030] font-bold rounded-lg disabled:opacity-40">
          {t.flip_next}
        </button>
      </div>
    </div>
  );
};

/* ==================== ModuleQuiz ==================== */
const ModuleQuiz = ({ questions, t, moduleId, onQuizSubmit, moduleName }) => {
  const [selected, setSelected] = useState({});
  const [submitted, setSubmitted] = useState({});
  const [groupIdx, setGroupIdx] = useState(0);
  const groupSize = 2;

  const [quizIndices] = useState(() =>
    [...Array(questions.length).keys()].sort(() => Math.random() - 0.5)
  );
  const totalGroups = Math.ceil(quizIndices.length / groupSize);

  const [shuffledMaps] = useState(() =>
    quizIndices.map(qIdx => {
      const n = questions[qIdx].opts.length;
      return [...Array(n).keys()].sort(() => Math.random() - 0.5);
    })
  );

  const totalAnswered = Object.keys(selected).length;
  const computeCorrect = () => {
    let c = 0;
    quizIndices.forEach((qIdx, qi) => {
      if (selected[qi] === undefined) return;
      if (shuffledMaps[qi][selected[qi]] === _d(questions[qIdx].ans)) c++;
    });
    return c;
  };
  const statusText = t.quiz_status
    .replace('{correct}', computeCorrect())
    .replace('{answered}', totalAnswered)
    .replace('{total}', quizIndices.length);

  const currentStart = groupIdx * groupSize;
  const currentIndices = quizIndices.slice(currentStart, currentStart + groupSize);

  const handleGroupSubmit = () => {
    const allDone = currentIndices.every((_, i) => selected[currentStart + i] !== undefined);
    if (!allDone) return;
    setSubmitted(s => ({ ...s, [groupIdx]: true }));
    if (groupIdx === totalGroups - 1 || Object.keys(submitted).length + 1 === totalGroups) {
      const wrongQs = [];
      let correct = 0;
      quizIndices.forEach((qIdx, qi) => {
        if (selected[qi] === undefined) return;
        if (shuffledMaps[qi][selected[qi]] === _d(questions[qIdx].ans)) correct++;
        else wrongQs.push(questions[qIdx].q);
      });
      onQuizSubmit(moduleId, correct, quizIndices.length, wrongQs, moduleName);
    }
  };

  return (
    <div className="mt-8 bg-slate-50 dark:bg-slate-900/50 rounded-2xl p-6 border border-slate-200 dark:border-slate-700">
      <h3 className="text-lg font-bold font-serif text-[#004030] dark:text-[#D8C3A5] mb-2">{t.quiz_title}</h3>
      <p className="text-sm text-slate-400 mb-6">{statusText}</p>
      {currentIndices.map((qIdx, localI) => {
        const qi = currentStart + localI;
        const q = questions[qIdx];
        const sMap = shuffledMaps[qi];
        const isGrpSub = !!submitted[groupIdx];
        return (
          <div key={qIdx} className="mb-6">
            <p className="font-bold mb-3">{qi + 1}. {q.q}</p>
            <div className="space-y-2">
              {sMap.map((origIdx, dIdx) => {
                const isCorrect = origIdx === _d(q.ans);
                const isSel = selected[qi] === dIdx;
                return (
                  <button key={dIdx} onClick={() => !isGrpSub && setSelected(s => ({ ...s, [qi]: dIdx }))}
                    className={`w-full text-left px-4 py-3 rounded-lg border transition-all text-sm
                      ${isGrpSub
                        ? isCorrect ? 'bg-green-100 border-green-500 dark:bg-green-900/30'
                          : isSel ? 'bg-red-100 border-red-400 dark:bg-red-900/30' : 'border-slate-200 dark:border-slate-700'
                        : isSel ? 'border-[#004030] dark:border-[#D8C3A5] bg-[#004030]/5' : 'border-slate-200 dark:border-slate-700 hover:border-slate-400'
                      }`}>
                    {q.opts[origIdx]}
                  </button>
                );
              })}
            </div>
            {isGrpSub && (
              <p className={`mt-2 text-sm italic ${shuffledMaps[qi][selected[qi]] === _d(q.ans)
                ? 'text-green-600 dark:text-green-400' : 'text-red-500 dark:text-red-400'}`}>
                {shuffledMaps[qi][selected[qi]] === _d(q.ans) ? `✓ ${t.correct}` : `✗ ${t.incorrect}`} — {t.explanation}：{q.exp}
              </p>
            )}
          </div>
        );
      })}
      <div className="flex items-center gap-3 flex-wrap">
        {!submitted[groupIdx]
          ? <button onClick={handleGroupSubmit}
            disabled={!currentIndices.every((_, i) => selected[currentStart + i] !== undefined)}
            className="px-6 py-2 bg-[#004030] dark:bg-[#D8C3A5] text-white dark:text-[#004030] font-bold rounded-lg disabled:opacity-40">
            {t.submit}
          </button>
          : <>
            {groupIdx < totalGroups - 1 && (
              <button onClick={() => setGroupIdx(groupIdx + 1)}
                className="px-6 py-2 bg-[#004030] dark:bg-[#D8C3A5] text-white dark:text-[#004030] font-bold rounded-lg">
                {t.quiz_next}
              </button>
            )}
            <button onClick={() => { setGroupIdx(0); setSelected({}); setSubmitted({}); }}
              className="px-6 py-2 border border-[#004030] dark:border-[#D8C3A5] text-[#004030] dark:text-[#D8C3A5] font-bold rounded-lg">
              {t.quiz_retry}
            </button>
          </>
        }
      </div>
    </div>
  );
};

/* ---------- Lab 1：職稱兩軸分類器 ---------- */
const LAB1_A1 = [_e(_SALT, 0), _e(_SALT, 0), _e(_SALT, 0), _e(_SALT, 0), _e(_SALT, 0), _e(_SALT, 1), _e(_SALT, 1), _e(_SALT, 1), _e(_SALT, 1), _e(_SALT, 1), _e(_SALT, 1), _e(_SALT, 2)];
const LAB1_A2 = [_e(_SALT, 0), _e(_SALT, 2), _e(_SALT, 2), _e(_SALT, 0), _e(_SALT, 0), _e(_SALT, 0), _e(_SALT, 3), _e(_SALT, 1), _e(_SALT, 0), _e(_SALT, 0), _e(_SALT, 0), _e(_SALT, 3)];

const LabTitleClassifier = ({ lang, t }) => {
  const [idx, setIdx] = useState(0);
  const [p1, setP1] = useState(null);
  const [p2, setP2] = useState(null);
  const [score, setScore] = useState({ done: 0, a1: 0, a2: 0 });
  const [locked, setLocked] = useState(false);

  const total = t.lab1_items.length;
  const ans1 = _d(LAB1_A1[idx]);
  const ans2 = _d(LAB1_A2[idx]);

  const pick1 = (n) => { if (!locked) setP1(n); };
  const pick2 = (n) => {
    if (locked || p1 === null) return;
    setP2(n);
    setLocked(true);
    setScore(s => ({ done: s.done + 1, a1: s.a1 + (p1 === ans1 ? 1 : 0), a2: s.a2 + (n === ans2 ? 1 : 0) }));
  };
  const next = () => { setP1(null); setP2(null); setLocked(false); setIdx(i => (i + 1) % total); };
  const reset = () => { setP1(null); setP2(null); setLocked(false); setIdx(0); setScore({ done: 0, a1: 0, a2: 0 }); };

  const statusText = t.lab1_score.replace('{done}', score.done).replace('{a1}', score.a1).replace('{a2}', score.a2);

  const btnClass = (isSel, isAns) => {
    if (!locked) return isSel ? 'bg-[#004030] dark:bg-[#D8C3A5] text-white dark:text-[#004030] border-[#004030] dark:border-[#D8C3A5] font-bold' : 'bg-white dark:bg-slate-900 border-slate-300 dark:border-slate-600 hover:border-[#004030] dark:hover:border-[#D8C3A5]';
    if (isAns) return 'bg-green-100 dark:bg-green-900/30 border-green-500 text-green-800 dark:text-green-300 font-bold';
    if (isSel) return 'bg-red-100 dark:bg-red-900/30 border-red-400 text-red-700 dark:text-red-300';
    return 'bg-white dark:bg-slate-900 border-slate-200 dark:border-slate-700 opacity-70';
  };

  return (
    <LabCard title={t.lab1_title} desc={t.lab1_desc}>
      <p className="text-xs text-slate-400 mb-3">{statusText}</p>
      <div className="rounded-xl border-2 border-[#D8C3A5] bg-[#004030]/5 dark:bg-[#D8C3A5]/10 p-4 mb-4">
        <p className="text-[11px] uppercase tracking-wider text-slate-500 mb-1">{idx + 1} / {total}</p>
        <p className="font-serif font-bold text-base sm:text-lg text-[#004030] dark:text-[#D8C3A5] break-words">{t.lab1_items[idx]}</p>
      </div>

      <p className="text-xs font-bold text-slate-500 mb-2">{t.lab1_axis1}</p>
      <div className="flex flex-wrap gap-2 mb-4">
        {t.lab1_a1_opts.map((o, i) => (
          <button key={i} onClick={() => pick1(i)}
            className={`px-3 py-2 rounded-lg text-sm border transition-all ${btnClass(p1 === i, i === ans1)}`}>{o}</button>
        ))}
      </div>

      <p className="text-xs font-bold text-slate-500 mb-2">{t.lab1_axis2}</p>
      <div className="flex flex-wrap gap-2 mb-3">
        {t.lab1_a2_opts.map((o, i) => (
          <button key={i} onClick={() => pick2(i)} disabled={p1 === null}
            className={`px-3 py-2 rounded-lg text-sm border transition-all disabled:opacity-40 ${btnClass(p2 === i, i === ans2)}`}>{o}</button>
        ))}
      </div>
      {p1 === null && !locked && <p className="text-xs text-slate-400 mb-3">{t.lab1_hint}</p>}

      {locked && (
        <div className="rounded-lg bg-slate-100 dark:bg-slate-900 p-3 mb-3">
          <p className="text-sm leading-relaxed text-slate-700 dark:text-slate-300">{t.lab1_exps[idx]}</p>
        </div>
      )}

      <div className="flex items-center gap-3 flex-wrap">
        <button onClick={next} disabled={!locked}
          className="px-5 py-2 bg-[#004030] dark:bg-[#D8C3A5] text-white dark:text-[#004030] font-bold rounded-lg text-sm disabled:opacity-40">
          {t.lab1_next}
        </button>
        <button onClick={reset}
          className="px-5 py-2 border border-slate-300 dark:border-slate-600 rounded-lg text-sm hover:bg-slate-100 dark:hover:bg-slate-700">
          {t.lab1_reset}
        </button>
      </div>
    </LabCard>
  );
};

/* ---------- Lab 2：JD 欄位分流器 ---------- */
const LAB2_ANS = [_e(_SALT, 0), _e(_SALT, 0), _e(_SALT, 1), _e(_SALT, 1), _e(_SALT, 1), _e(_SALT, 1), _e(_SALT, 3), _e(_SALT, 3)];

const LabFieldSorter = ({ lang, t }) => {

    setPlaced(p => ({ ...p, [active]: b }));

  const statusText = t.lab2_score.replace('{done}', doneCount).replace('{right}', rightCount);

      <div className="flex flex-wrap gap-2 mb-5">

                  : 'bg-red-100 dark:bg-red-900/30 border-red-400 text-red-700 dark:text-red-300')

                  : 'bg-white dark:bg-slate-900 border-slate-300 dark:border-slate-600 hover:border-[#004030] dark:hover:border-[#D8C3A5]'}`}>

          <button key={i} onClick={() => drop(i)} disabled={active === null}

            style={{ borderColor: bucketTone[i], color: bucketTone[i], backgroundColor: bucketTone[i] + '14' }}>
            {b}
